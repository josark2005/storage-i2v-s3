name: Daily Image-to-Video

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD), 留空则用当天'
        required: false
        type: string
      fps:
        description: 'Override frame rate, 留空则用环境变量 FPS'
        required: false
        type: string
      source_endpoint:
        description: 'Override source S3 endpoint'
        required: false
        type: string
      source_region:
        description: 'Override source S3 region'
        required: false
        type: string
      source_access_key:
        description: 'Override source S3 access key'
        required: false
        type: string
      source_secret_key:
        description: 'Override source S3 secret key'
        required: false
        type: string
      source_bucket:
        description: 'Override source S3 bucket'
        required: false
        type: string
      source_prefix:
        description: 'Override source prefix'
        required: false
        type: string
      dest_endpoint:
        description: 'Override destination S3 endpoint'
        required: false
        type: string
      dest_region:
        description: 'Override destination S3 region'
        required: false
        type: string
      dest_access_key:
        description: 'Override destination S3 access key'
        required: false
        type: string
      dest_secret_key:
        description: 'Override destination S3 secret key'
        required: false
        type: string
      dest_bucket:
        description: 'Override destination S3 bucket'
        required: false
        type: string
      dest_prefix:
        description: 'Override destination prefix'
        required: false
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run image-to-video
        env:
SOURCE_S3_ENDPOINT: ${{ inputs.source_endpoint || secrets.SOURCE_S3_ENDPOINT }}
          SOURCE_S3_REGION: ${{ inputs.source_region || secrets.SOURCE_S3_REGION }}
          SOURCE_S3_ACCESS_KEY: ${{ inputs.source_access_key || secrets.SOURCE_S3_ACCESS_KEY }}
          SOURCE_S3_SECRET_KEY: ${{ inputs.source_secret_key || secrets.SOURCE_S3_SECRET_KEY }}
          SOURCE_S3_BUCKET: ${{ inputs.source_bucket || secrets.SOURCE_S3_BUCKET }}
          SOURCE_PREFIX: ${{ inputs.source_prefix || secrets.SOURCE_PREFIX }}
          DEST_S3_ENDPOINT: ${{ inputs.dest_endpoint || secrets.DEST_S3_ENDPOINT }}
          DEST_S3_REGION: ${{ inputs.dest_region || secrets.DEST_S3_REGION }}
          DEST_S3_ACCESS_KEY: ${{ inputs.dest_access_key || secrets.DEST_S3_ACCESS_KEY }}
          DEST_S3_SECRET_KEY: ${{ inputs.dest_secret_key || secrets.DEST_S3_SECRET_KEY }}
          DEST_S3_BUCKET: ${{ inputs.dest_bucket || secrets.DEST_S3_BUCKET }}
          DEST_PREFIX: ${{ inputs.dest_prefix || secrets.DEST_PREFIX }}
          FPS: ${{ inputs.fps || secrets.FPS }}
          OVERRIDE_DATE: ${{ inputs.date }}
        run: python main.py
