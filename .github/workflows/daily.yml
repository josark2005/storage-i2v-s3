name: Daily Image-to-Video

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD), 留空则用当天'
        required: false
        type: string
      fps:
        description: 'Override frame rate, 留空则用环境变量 FPS'
        required: false
        type: string
      source_endpoint:
        description: 'Override source S3 endpoint'
        required: false
        type: string
      source_region:
        description: 'Override source S3 region'
        required: false
        type: string
      source_access_key:
        description: 'Override source S3 access key'
        required: false
        type: string
      source_secret_key:
        description: 'Override source S3 secret key'
        required: false
        type: string
      source_bucket:
        description: 'Override source S3 bucket'
        required: false
        type: string
      source_prefix:
        description: 'Override source prefix'
        required: false
        type: string
      dest_endpoint:
        description: 'Override destination S3 endpoint'
        required: false
        type: string
      dest_region:
        description: 'Override destination S3 region'
        required: false
        type: string
      dest_access_key:
        description: 'Override destination S3 access key'
        required: false
        type: string
      dest_secret_key:
        description: 'Override destination S3 secret key'
        required: false
        type: string
      dest_bucket:
        description: 'Override destination S3 bucket'
        required: false
        type: string
      dest_prefix:
        description: 'Override destination prefix'
        required: false
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run image-to-video
        env:
          SOURCE_S3_ENDPOINT: ${{ github.event_name == 'workflow_dispatch' && inputs.source_endpoint || vars.SOURCE_S3_ENDPOINT || secrets.SOURCE_S3_ENDPOINT }}
          SOURCE_S3_REGION: ${{ github.event_name == 'workflow_dispatch' && inputs.source_region || vars.SOURCE_S3_REGION || secrets.SOURCE_S3_REGION }}
          SOURCE_S3_ACCESS_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.source_access_key || vars.SOURCE_S3_ACCESS_KEY || secrets.SOURCE_S3_ACCESS_KEY }}
          SOURCE_S3_SECRET_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.source_secret_key || vars.SOURCE_S3_SECRET_KEY || secrets.SOURCE_S3_SECRET_KEY }}
          SOURCE_S3_BUCKET: ${{ github.event_name == 'workflow_dispatch' && inputs.source_bucket || vars.SOURCE_S3_BUCKET || secrets.SOURCE_S3_BUCKET }}
          SOURCE_PREFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.source_prefix || vars.SOURCE_PREFIX || secrets.SOURCE_PREFIX }}
          DEST_S3_ENDPOINT: ${{ github.event_name == 'workflow_dispatch' && inputs.dest_endpoint || vars.DEST_S3_ENDPOINT || secrets.DEST_S3_ENDPOINT }}
          DEST_S3_REGION: ${{ github.event_name == 'workflow_dispatch' && inputs.dest_region || vars.DEST_S3_REGION || secrets.DEST_S3_REGION }}
          DEST_S3_ACCESS_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.dest_access_key || vars.DEST_S3_ACCESS_KEY || secrets.DEST_S3_ACCESS_KEY }}
          DEST_S3_SECRET_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.dest_secret_key || vars.DEST_S3_SECRET_KEY || secrets.DEST_S3_SECRET_KEY }}
          DEST_S3_BUCKET: ${{ github.event_name == 'workflow_dispatch' && inputs.dest_bucket || vars.DEST_S3_BUCKET || secrets.DEST_S3_BUCKET }}
          DEST_PREFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.dest_prefix || vars.DEST_PREFIX || secrets.DEST_PREFIX }}
          FPS: ${{ github.event_name == 'workflow_dispatch' && inputs.fps || vars.FPS || secrets.FPS || 24 }}
          OVERRIDE_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.date || '' }}
        run: python main.py